# Đỉnh nghĩa rate limit cho API đăng ký khuôn mặt (tối đa 5 request/phút theo IP)
limit_req_zone $binary_remote_addr zone=face_reg_limit:10m rate=5r/m;

server {
    listen 80;
    server_name localhost smartboxeiu.site www.smartboxeiu.site;

    # Giao diện React Static Build
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Rate limit riêng cho API đăng ký khuôn mặt
    location = /api/face/register {
        limit_req zone=face_reg_limit burst=2 nodelay;
        proxy_pass http://backend:8080/api/face/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy cho Spring Boot API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Tối ưu bỏ qua log các file mặc định
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cấu hình nén Gzip giúp tải trang nhanh hơn
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
